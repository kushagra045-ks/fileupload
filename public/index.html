<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wavelength</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg-grid"></div>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="/config.js"></script>
<script>
  // Load the socket.io client from wherever the backend actually is
  // (same origin unless you've split hosting and set API_BASE in config.js
  // above). Avoids depending on an external CDN, which some networks,
  // firewalls, or ad-blockers block outright.
  document.write('<script src="' + (window.API_BASE || '') + '/socket.io/socket.io.js"><\/script>');
</script>
<script src="/app.js"></script>
</body>
</html>
